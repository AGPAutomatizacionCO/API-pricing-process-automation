name: CI

# Corre en cada PR y en cada push a cualquier rama. No toca Azure ni publica nada.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          sudo apt-get update -y && sudo apt-get install -y --no-install-recommends unixodbc-dev
          pip install -r requirements.txt pytest httpx

      - name: Pruebas
        working-directory: backend
        run: python -m pytest tests -q

      - name: Auditoria de dependencias
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  docker-build:
    # Verifica que la imagen construye; no la publica.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t api-pricing:ci .
